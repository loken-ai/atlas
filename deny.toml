[advisories]
yanked = "deny"
# paste is reached through the GUI stack and has no maintained replacement there.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
# The crate is MIT OR Apache-2.0 and depends only on things that can live inside that; the
# font licences cover the faces egui ships.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
